# Pinned: Compose otherwise names the stack after the folder, so renaming the folder
# would silently start a new stack with empty data volumes.
name: data_pipeline

# ${VAR:-default} values are read from .env (the same file the pipeline uses), so the
# database and its clients cannot drift apart.
services:
  pgdatabase:
    image: postgres:18
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-root}"
      POSTGRES_DB: "${POSTGRES_DB:-kbo}"
    volumes:
      - kbo_postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # $$ defers expansion to the container, which has these variables set.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.19
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "root"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8085:80"

  # One-off ETL runs: `docker compose run --rm kbo --date 2026-11-14`.
  # The profile keeps it out of a plain `docker compose up`.
  kbo:
    build: .
    profiles: ["etl"]
    env_file: .env
    environment:
      # Inside the Compose network Postgres is reached by service name, not localhost.
      POSTGRES_HOST: pgdatabase
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/app/data
    depends_on:
      pgdatabase:
        # Wait until Postgres accepts connections, not merely until its container exists.
        condition: service_healthy

volumes:
  kbo_postgres_data:
  pgadmin_data:
