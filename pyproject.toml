[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbo"
version = "0.1.0"
description = "Belgian KBO Open Data ETL pipeline: download archives and load them into PostgreSQL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# only needed by kbo.helper.inspect_data
debug = ["pandas>=2"]

[project.scripts]
kbo = "kbo.main:main"
kbo-warehouse = "kbo.warehouse:main"

[tool.setuptools.packages.find]
include = ["kbo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists every skipped test with its reason, so a missing database is never silent.
addopts = "-ra"
markers = [
    "db: needs a running PostgreSQL server (each run uses its own throwaway database)",
]
